{% if messages %}
    {% for message in messages %}
        <div class="toast orders-toast border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <i class="bi
                    {% if 'success' in message.tags %}bi-check-circle-fill text-success
                    {% elif 'warning' in message.tags %}bi-exclamation-triangle-fill text-warning
                    {% elif 'error' in message.tags or 'danger' in message.tags %}bi-x-circle-fill text-danger
                    {% else %}bi-info-circle-fill text-info{% endif %}
                    me-2 fs-5"></i>
                <strong class="me-auto">HelpService</strong>
                <small class="text-body-secondary">только что</small>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Закрыть"></button>
            </div>
            <div class="toast-body">
                {{ message|safe }}
            </div>
        </div>
    {% endfor %}
{% endif %}
